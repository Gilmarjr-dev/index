<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora - V3.0 Final</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; padding: 15px; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 20px; gap: 10px; }
        .tab { flex: 1; padding: 12px; background: #333; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab.active { background: #f1c40f; color: black; }
        .modulo { display: none; }
        .modulo.active { display: block; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; font-size: 16px; }
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-apps { background-color: #f1c40f; color: black; }
        .btn-ida { background-color: #3498db; color: white; }
        .btn-volta { background-color: #2ecc71; color: white; }
        .btn-gps { background-color: #2980b9; color: white; margin-bottom: 10px; font-size: 14px; padding: 12px; border: 1px solid #3498db; }
        .resultado { margin-top: 20px; padding: 15px; background: #252525; border-radius: 10px; border-left: 5px solid #f1c40f; text-align: left; }
        .loading { color: #f1c40f; font-size: 14px; display: none; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="color: #f1c40f; margin-bottom: 5px;">🚗 BORA</h2>
        <p style="margin-top: 0; opacity: 0.6; font-size: 12px;">Versão Inteligente - Vale do Aço</p>

        <div class="tabs">
            <div id="tab1" class="tab active" onclick="mudarAba(1)">PARTICULAR</div>
            <div id="tab2" class="tab" onclick="mudarAba(2)">APPS (UBER/99)</div>
        </div>

        <div id="modulo1" class="modulo active">
            <input type="time" id="p_hora" value="12:00">
            <input type="text" id="p_ori" placeholder="Origem (Ex: Melo Viana, Fabri)">
            <input type="text" id="p_dest" placeholder="Destino (Ex: Centro)">
            
            <div id="statusGps" class="loading">Iniciando busca... 📍</div>
            <button class="btn-gps" onclick="buscarRotaReal()">🔍 CALCULAR ROTA REAL (VIA RUAS)</button>

            <input type="number" id="p_km" placeholder="Distância Real (KM)" step="0.01">
            
            <button class="btn-ida" onclick="calcParticular(1)">SÓ IDA (R$ 3,00/km)</button>
            <button class="btn-volta" onclick="calcParticular(2)">IDA E VOLTA (R$ 4,00/km)</button>
        </div>

        <div id="modulo2" class="modulo">
            <input type="number" id="a_valor" placeholder="Valor Recebido (R$)">
            <input type="number" id="a_km" placeholder="Distância Total (KM)">
            <input type="number" id="a_min" placeholder="Tempo de Viagem (Min)">
            <button class="btn-apps" onclick="calcApps()">ANALISAR VIABILIDADE 🚀</button>
        </div>

        <div id="resBox" class="resultado" style="display: none;">
            <div id="resTexto"></div>
        </div>
    </div>
</div>

<script>
    function mudarAba(aba) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.modulo').forEach(m => m.classList.remove('active'));
        document.getElementById('tab' + aba).classList.add('active');
        document.getElementById('modulo' + aba).classList.add('active');
        document.getElementById('resBox').style.display = 'none';
    }

    async function buscarRotaReal() {
        let oriRaw = document.getElementById('p_ori').value.trim();
        let destRaw = document.getElementById('p_dest').value.trim();
        const status = document.getElementById('statusGps');

        if (!oriRaw || !destRaw) return alert("Digite Origem e Destino!");

        status.style.display = "block";
        status.innerHTML = "Processando endereços... 📍";

        function formatarEndereco(texto) {
            let t = texto.toLowerCase();
            if (!t.includes("coronel fabriciano") && (t.includes("fabri") || t.includes("fabriciano"))) {
                t = t.replace(/fabri(ciano)?/g, "Coronel Fabriciano");
            }
            if (!t.includes("coronel fabriciano") && !t.includes("ipatinga") && !t.includes("timoteo")) {
                t += ", Coronel Fabriciano, MG";
            }
            if (!t.includes("mg")) t += ", MG";
            return t;
        }

        const oriFinal = formatarEndereco(oriRaw);
        const destFinal = formatarEndereco(destRaw);

        try {
            const r1 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(oriFinal)}&limit=1`);
            const d1 = await r1.json();
            const r2 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destFinal)}&limit=1`);
            const d2 = await r2.json();

            if (d1.length > 0 && d2.length > 0) {
                const lon1 = d1[0].lon; const lat1 = d1[0].lat;
                const lon2 = d2[0].lon; const lat2 = d2[0].lat;

                status.innerHTML = "Traçando rota pelas ruas... 🛣️";

                const rotaUrl = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
                const resRota = await fetch(rotaUrl);
                const dataRota = await resRota.json();

                if (dataRota.code === "Ok") {
                    const distanciaKm = dataRota.routes[0].distance / 1000;
                    const kmFinal = distanciaKm * 1.05; // Margem de segurança
                    
                    document.getElementById('p_km').value = kmFinal.toFixed(2);
                    status.innerHTML = "✅ KM atualizado!";
                } else {
                    alert("Erro ao traçar rota por ruas.");
                }
            } else {
                alert("Endereço não localizado. Tente: Bairro, Cidade");
            }
        } catch (e) {
            alert("Erro de conexão com o servidor de mapas.");
        } finally {
            setTimeout(() => { status.style.display = "none"; }, 3000);
        }
    }

    function calcParticular(tipo) {
        const h = document.getElementById('p_hora').value;
        const km = parseFloat(document.getElementById('p_km').value);
        if (!km) return alert("Calcule o KM primeiro!");

        const hora = parseInt(h.split(':')[0]);
        let taxa = 0;
        if (hora >= 0 && hora < 6) taxa = 15;
        else if (hora >= 21) taxa = 10;
        else if (hora < 7 || (hora >= 19 && hora < 21)) taxa = 5;

        const valKm = (tipo === 1) ? 3 : 4;
        const total = (km * valKm) + taxa;
        
        document.getElementById('resTexto').innerHTML = `
            <b>Orçamento Total: R$ ${total.toFixed(2)}</b><br>
            Distância: ${km.toFixed(2)} KM<br>
            Tipo: ${tipo === 1 ? 'Só Ida' : 'Ida e Volta'}<br>
            Taxa de Horário: R$ ${taxa.toFixed(2)}
        `;
        document.getElementById('resBox').style.display = 'block';
    }

    function calcApps() {
        const v = parseFloat(document.getElementById('a_valor').value);
        const k = parseFloat(document.getElementById('a_km').value);
        const m = parseFloat(document.getElementById('a_min').value);
        if(!v || !k || !m) return alert("Preencha todos os campos!");

        const gKm = v / k;
        const gH = (v / m) * 60;
        document.getElementById('resTexto').innerHTML = `
            <b>G/KM:</b> R$ ${gKm.toFixed(2)}<br>
            <b>G/Hora:</b> R$ ${gH.toFixed(2)}
        `;
        document.getElementById('resBox').style.display = 'block';
    }
</script>
</body>
</html>
